<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重点项目清单（内部）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f6f8;
  color: #1a1a2e;
  font-size: 14px;
  line-height: 1.6;
}
.header {
  background: linear-gradient(135deg, #0C447C 0%, #378ADD 100%);
  color: #fff;
  padding: 18px 32px;
}
.header h1 { font-size: 24px; font-weight: 600; }
.header .sub { font-size: 14px; opacity: 0.85; margin-top: 4px; }
.header .stats { font-size: 14px; margin-top: 6px; opacity: 0.9; }
.header .stats b { font-size: 17px; }
.badge-internal {
  display: inline-block;
  background: #c62828;
  color: #fff;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 8px;
  vertical-align: middle;
  font-weight: 600;
}
.role-badge {
  display: inline-block;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 8px;
  vertical-align: middle;
  font-weight: 600;
}
.role-admin { background: #1b5e20; color: #fff; }
.role-editor { background: #e65100; color: #fff; }
.toolbar {
  background: #fff;
  border-bottom: 1px solid #e8e8ec;
  padding: 12px 32px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.tabs { display: flex; gap: 0; }
.tab {
  border: 1px solid #d3d1c7;
  background: #fff;
  padding: 6px 18px;
  font-size: 13px;
  cursor: pointer;
  color: #444441;
}
.tab:first-child { border-radius: 6px 0 0 6px; }
.tab:last-child { border-radius: 0 6px 6px 0; }
.tab + .tab { border-left: none; }
.tab.active { background: #0C447C; color: #fff; border-color: #0C447C; }
.tag-filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag-filter .label { font-size: 12px; color: #5F5E5A; margin-right: 4px; }
.chip {
  border: 1px solid;
  background: #fff;
  padding: 4px 12px;
  font-size: 12px;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.chip.active { font-weight: 600; }
.chip:hover { opacity: 0.85; }
.chip[data-tag="关系稳定"] { color: #0C447C; border-color: #378ADD; }
.chip[data-tag="关系稳定"].active { background: #E6F1FB; }
.chip[data-tag="业务合作"] { color: #085041; border-color: #1D9E75; }
.chip[data-tag="业务合作"].active { background: #E1F5EE; }
.chip[data-tag="录取率高"] { color: #27500A; border-color: #639922; }
.chip[data-tag="录取率高"].active { background: #EAF3DE; }
.chip[data-tag="关注度高"] { color: #3C3489; border-color: #7F77DD; }
.chip[data-tag="关注度高"].active { background: #EEEDFE; }
.chip[data-tag="录取案例"] { color: #633806; border-color: #BA7517; }
.chip[data-tag="录取案例"].active { background: #FAEEDA; }
.chip[data-tag="潜力项目"] { color: #712B13; border-color: #D85A30; }
.chip[data-tag="潜力项目"].active { background: #FAECE7; }
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 6px 12px;
  font-size: 13px;
  border: 1px solid #d3d1c7;
  border-radius: 6px;
  outline: none;
}
.search-box:focus { border-color: #5F5E5A; }
.btn {
  padding: 6px 14px;
  font-size: 12px;
  border: 1px solid #d3d1c7;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  color: #444441;
}
.btn:hover { background: #f1efe8; }
.clear-link { font-size: 12px; color: #378ADD; cursor: pointer; margin-left: 8px; }
.clear-link:hover { text-decoration: underline; }
.table-wrap {
  padding: 12px 32px;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
th {
  background: #f1efe8;
  text-align: left;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  color: #444441;
  white-space: nowrap;
}
td {
  padding: 8px 12px;
  font-size: 14px;
  border-top: 1px solid #eef0f3;
  vertical-align: middle;
}
tr:hover td { background: #fafbff; }
.school-cell { font-weight: 600; white-space: nowrap; }
.major-cell { color: #444441; }
.foreign-cell { color: #5F5E5A; font-size: 13px; }
.type-badge {
  display: inline-block;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
}
.type-badge.合作办学 { background: #E6F1FB; color: #0C447C; }
.type-badge.联考 { background: #FAEEDA; color: #633806; }
.tag-list { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 10px;
  white-space: nowrap;
}
.tag-关系稳定 { background: #E6F1FB; color: #0C447C; }
.tag-业务合作 { background: #E1F5EE; color: #085041; }
.tag-录取率高 { background: #EAF3DE; color: #27500A; }
.tag-关注度高 { background: #EEEDFE; color: #3C3489; }
.tag-录取案例 { background: #FAEEDA; color: #633806; }
.tag-潜力项目 { background: #FAECE7; color: #712B13; }
.tag-over-limit { border: 2px solid #c62828; border-radius: 12px; }
.note-cell {
  color: #5F5E5A;
  font-size: 13px;
  width: 360px;
  max-width: 360px;
  min-width: 260px;
}
.note-view {
  display: flex;
  align-items: center;
  gap: 8px;
}
.note-text {
  flex: 1;
  word-break: break-word;
  overflow-wrap: break-word;
  line-height: 1.5;
  white-space: normal;
}
.note-text.empty { color: #bbb; font-style: italic; }
.note-edit-btn {
  font-size: 12px;
  color: #378ADD;
  background: none;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  padding: 2px 6px;
  flex-shrink: 0;
}
.note-edit-btn:hover { text-decoration: underline; }
.note-edit-area {
  width: 100%;
  min-height: 60px;
  font-size: 13px;
  font-family: inherit;
  border: 1px solid #378ADD;
  border-radius: 4px;
  padding: 6px 8px;
  outline: none;
  resize: vertical;
  line-height: 1.5;
  color: #1a1a2e;
}
.note-edit-actions {
  margin-top: 4px;
  display: flex;
  gap: 6px;
}
.note-save-btn {
  font-size: 12px;
  padding: 3px 12px;
  border: none;
  border-radius: 4px;
  background: #0C447C;
  color: #fff;
  cursor: pointer;
}
.note-save-btn:hover { background: #378ADD; }
.note-cancel-btn {
  font-size: 12px;
  padding: 3px 12px;
  border: 1px solid #d3d1c7;
  border-radius: 4px;
  background: #fff;
  color: #5F5E5A;
  cursor: pointer;
}
.note-cancel-btn:hover { background: #f1efe8; }
.empty-row td { text-align: center; color: #888780; padding: 40px; }

/* === 海报列 === */
.poster-cell { min-width: 100px; }
.poster-grid {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.poster-thumb {
  position: relative;
  width: 44px;
  height: 44px;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid #e0e0e6;
  flex-shrink: 0;
}
.poster-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.poster-thumb:hover { border-color: #378ADD; }
.poster-thumb .remove-btn {
  position: absolute;
  top: -2px;
  right: -2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #c62828;
  color: #fff;
  border: none;
  font-size: 10px;
  line-height: 16px;
  text-align: center;
  cursor: pointer;
  opacity: 0.65;
  transition: opacity 0.15s;
  z-index: 2;
}
.poster-thumb:hover .remove-btn { opacity: 1; }
.poster-add {
  width: 44px;
  height: 44px;
  border: 1px dashed #c5c5cc;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  color: #bbb;
  transition: all 0.15s;
  flex-shrink: 0;
  position: relative;
}
.poster-add:hover { border-color: #378ADD; color: #378ADD; }
.poster-add input { display: none; }
.poster-add.disabled { opacity: 0.35; cursor: not-allowed; }

/* === 海报预览弹窗 === */
.poster-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 40px;
}
.poster-modal.show { display: flex; }
.poster-modal img {
  max-width: 90vw;
  max-height: 85vh;
  border-radius: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
.poster-modal .close-btn {
  position: absolute;
  top: 20px;
  right: 30px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: none;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.poster-modal .close-btn:hover { background: rgba(255,255,255,0.3); }

/* === 新增项目弹窗 === */
.btn-primary {
  padding: 6px 16px;
  font-size: 12px;
  border: none;
  background: #0C447C;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
.btn-primary:hover { background: #378ADD; }
.add-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 20px;
}
.add-modal.show { display: flex; }
.add-modal .form-card {
  background: #fff;
  border-radius: 10px;
  padding: 28px 32px;
  width: 520px;
  max-width: 90vw;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.add-modal .form-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 18px;
  color: #1a1a2e;
}
.add-modal .form-row {
  margin-bottom: 14px;
}
.add-modal .form-label {
  font-size: 12px;
  color: #5F5E5A;
  margin-bottom: 4px;
  display: block;
}
.add-modal .form-label .required { color: #c62828; }
.add-modal .form-input,
.add-modal .form-textarea {
  width: 100%;
  padding: 7px 10px;
  font-size: 13px;
  border: 1px solid #d3d1c7;
  border-radius: 6px;
  outline: none;
  font-family: inherit;
}
.add-modal .form-input:focus,
.add-modal .form-textarea:focus { border-color: #378ADD; }
.add-modal .form-textarea { min-height: 60px; resize: vertical; line-height: 1.5; }
.add-modal .radio-group {
  display: flex;
  gap: 12px;
}
.add-modal .radio-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  cursor: pointer;
}
.add-modal .tag-checks {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.add-modal .tag-check {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  cursor: pointer;
  padding: 3px 8px;
  border: 1px solid #d3d1c7;
  border-radius: 12px;
  user-select: none;
}
.add-modal .tag-check input { margin: 0; cursor: pointer; }
.add-modal .tag-check:has(input:checked) {
  font-weight: 600;
}
.add-modal .form-actions {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
.add-modal .tag-count-hint {
  font-size: 11px;
  color: #888780;
  margin-top: 6px;
}
.add-modal .tag-count-hint.over { color: #c62828; font-weight: 600; }
.add-modal .input-hint {
  font-size: 11px;
  color: #888780;
  margin-top: 4px;
}

/* 自建项目行标 */
.custom-badge {
  display: inline-block;
  font-size: 10px;
  background: #1D9E75;
  color: #fff;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 4px;
  vertical-align: middle;
}
.delete-proj-btn {
  font-size: 12px;
  color: #c62828;
  background: #fff;
  border: 1px solid #c62828;
  border-radius: 4px;
  cursor: pointer;
  margin-left: 6px;
  white-space: nowrap;
  padding: 2px 8px;
  line-height: 1.4;
}
.delete-proj-btn:hover {
  background: #c62828;
  color: #fff;
}

/* === 新增项目弹窗：自动补全 === */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: fixed;
  max-height: 220px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid #d3d1c7;
  border-top: none;
  border-radius: 0 0 6px 6px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  z-index: 100000;
  display: none;
}
.autocomplete-list.show { display: block; }
.autocomplete-item {
  padding: 8px 10px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 1px solid #f1efe8;
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover,
.autocomplete-item.active {
  background: #E6F1FB;
}
.autocomplete-item .sub {
  font-size: 11px;
  color: #5F5E5A;
  margin-top: 2px;
}
.add-modal .form-select {
  width: 100%;
  padding: 7px 10px;
  font-size: 13px;
  border: 1px solid #d3d1c7;
  border-radius: 6px;
  outline: none;
  font-family: inherit;
  background: #fff;
}
.add-modal .form-select:focus { border-color: #378ADD; }
.foreign-hint {
  font-size: 11px;
  color: #888780;
  margin-top: 4px;
}
/* 密码门样式 */
.gate-overlay {
  position: fixed; inset: 0; z-index: 999999;
  background: linear-gradient(135deg, #0C447C 0%, #378ADD 100%);
  display: flex; align-items: center; justify-content: center;
}
.gate-box {
  background: #fff; border-radius: 16px; padding: 40px 36px;
  width: 360px; max-width: 90vw; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.gate-box h2 { font-size: 20px; color: #0C447C; margin-bottom: 6px; }
.gate-box p { font-size: 13px; color: #888; margin-bottom: 24px; }
.gate-box input {
  width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
  border-radius: 8px; font-size: 16px; outline: none; transition: border 0.2s;
}
.gate-box input:focus { border-color: #378ADD; }
.gate-box button {
  width: 100%; margin-top: 16px; padding: 12px;
  background: linear-gradient(135deg, #0C447C 0%, #378ADD 100%);
  color: #fff; border: none; border-radius: 8px;
  font-size: 16px; cursor: pointer; transition: opacity 0.2s;
}
.gate-box button:hover { opacity: 0.9; }
.gate-error { color: #c62828; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>

<!-- 密码门 -->
<div class="gate-overlay" id="gateOverlay">
  <div class="gate-box">
    <h2>重点项目清单</h2>
    <p>内部使用 · 请输入访问密码</p>
    <input type="password" id="gateInput" placeholder="请输入密码" autofocus>
    <button id="gateBtn" onclick="checkGate()">进 入</button>
    <div class="gate-error" id="gateError">密码错误，请重试</div>
  </div>
</div>

<div class="header">
  <h1>重点项目清单<span class="badge-internal">内部使用</span><span class="role-badge" id="roleBadge"></span></h1>
  <div class="sub">联考 & 合作办学硕士 · 手动维护 · 标签聚焦运营与销售资源</div>
  <div class="stats">符合条件 <b id="resultCount">—</b> / 共 <span id="totalCount">—</span> 个项目</div>
</div>

<div class="toolbar">
  <div class="tabs">
    <button class="tab active" data-type="all">全部</button>
    <button class="tab" data-type="合作办学">合作办学</button>
    <button class="tab" data-type="联考">联考</button>
  </div>
  <div class="tag-filter">
    <span class="label">标签</span>
    <button class="chip" data-tag="关系稳定">关系稳定</button>
    <button class="chip" data-tag="业务合作">业务合作</button>
    <button class="chip" data-tag="录取率高">录取率高</button>
    <button class="chip" data-tag="关注度高">关注度高</button>
    <button class="chip" data-tag="录取案例">录取案例</button>
    <button class="chip" data-tag="潜力项目">潜力项目</button>
    <span class="clear-link" id="clearTags">清除</span>
  </div>
  <input type="search" class="search-box" id="searchInput" placeholder="搜索学校 / 专业 / 外方院校...">
  <button class="btn" id="exportBtn">导出 CSV</button>
  <button class="btn" id="exportDataBtn">导出数据</button>
  <button class="btn" id="importDataBtn">导入数据</button>
  <button class="btn admin-only" id="restoreBtn" style="display:none;">↩ 恢复已隐藏</button>
  <button class="btn-primary" id="addProjBtn">+ 新增项目</button>
</div>

<div class="table-wrap">
  <table id="dataTable">
    <thead>
      <tr>
        <th>类型</th>
        <th>学校</th>
        <th>外方院校</th>
        <th>专业</th>
        <th>标签</th>
        <th>备注</th>
        <th>海报</th>
      </tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>
</div>

<div class="poster-modal" id="posterModal">
  <button class="close-btn" id="modalClose">&times;</button>
  <img id="modalImg" src="" alt="海报预览">
</div>

<div class="add-modal" id="addModal">
  <div class="form-card">
    <div class="form-title">新增项目</div>
    <div class="form-row">
      <span class="form-label">类型 <span class="required">*</span></span>
      <div class="radio-group">
        <label class="radio-item"><input type="radio" name="addType" value="合作办学" checked> 合作办学</label>
        <label class="radio-item"><input type="radio" name="addType" value="联考"> 联考</label>
      </div>
    </div>
    <div class="form-row" id="projectSearchRow">
      <span class="form-label">快速搜索项目</span>
      <div class="autocomplete-wrap">
        <input type="text" class="form-input" id="addProjectSearch" placeholder="输入学校 / 外方 / 专业 任一关键词，如：南昌大学 普瓦提埃" autocomplete="off">
        <div class="autocomplete-list" id="projectSearchSuggest"></div>
      </div>
      <div class="input-hint">搜索到项目后会自动填充下方三个字段</div>
    </div>
    <div class="form-row">
      <span class="form-label">学校 <span class="required">*</span></span>
      <div class="autocomplete-wrap">
        <input type="text" class="form-input" id="addSchool" placeholder="如：中国人民大学" autocomplete="off">
        <div class="autocomplete-list" id="schoolSuggest"></div>
      </div>
    </div>
    <div class="form-row" id="foreignRow">
      <span class="form-label">外方院校</span>
      <div class="autocomplete-wrap">
        <input type="text" class="form-input" id="addForeign" placeholder="合作办学填写外方院校，联考留空" autocomplete="off">
        <div class="autocomplete-list" id="foreignSuggest"></div>
      </div>
    </div>
    <div class="form-row">
      <span class="form-label">专业 <span class="required">*</span></span>
      <div class="autocomplete-wrap" id="majorInputWrap">
        <input type="text" class="form-input" id="addMajor" placeholder="如：金融学硕士" autocomplete="off">
        <div class="autocomplete-list" id="majorSuggest"></div>
      </div>
      <select class="form-select" id="addMajorSelect" style="display:none;">
        <option value="">请选择专业</option>
        <option value="工商管理硕士(MBA)">工商管理硕士(MBA)</option>
        <option value="工程管理硕士(MEM)">工程管理硕士(MEM)</option>
        <option value="高级管理人员工商管理硕士(EMBA)">高级管理人员工商管理硕士(EMBA)</option>
        <option value="公共管理硕士(MPA)">公共管理硕士(MPA)</option>
        <option value="会计硕士(MPAcc)">会计硕士(MPAcc)</option>

<script>
// ====== 密码门验证（双角色） ======
const GATE_HASH_ADMIN  = "c1a778c2ab5983060ae17c50e0cd9041c4e4fa872bbd8da01a6e79b23df09566"; // 管理员
const GATE_HASH_EDITOR = "a9d7d7b7171e93dad71ec6b5627d3448b0ac24812ee2451415d83ebdd7d4cea8"; // 编辑者
function getRole() { return sessionStorage.getItem("priority_role") || ""; }
function isAdmin() { return getRole() === "admin"; }
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function checkGate() {
  const input = document.getElementById("gateInput").value.trim();
  if (!input) return;
  const hashed = await sha256(input);
  if (hashed === GATE_HASH_ADMIN) {
    sessionStorage.setItem("priority_authed", "1");
    sessionStorage.setItem("priority_role", "admin");
    document.getElementById("gateOverlay").style.display = "none";
    onGatePassed();
  } else if (hashed === GATE_HASH_EDITOR) {
    sessionStorage.setItem("priority_authed", "1");
    sessionStorage.setItem("priority_role", "editor");
    document.getElementById("gateOverlay").style.display = "none";
    onGatePassed();
  } else {
    document.getElementById("gateError").style.display = "block";
    document.getElementById("gateInput").value = "";
    document.getElementById("gateInput").focus();
  }
}
function onGatePassed() {
  // 根据角色显示/隐藏管理员专属元素
  const adminOnly = document.querySelectorAll(".admin-only");
  adminOnly.forEach(el => { el.style.display = isAdmin() ? "" : "none"; });
  // 更新角色标识
  const badge = document.getElementById("roleBadge");
  if (badge) {
    badge.textContent = isAdmin() ? "管理员" : "编辑者";
    badge.className = "role-badge " + (isAdmin() ? "role-admin" : "role-editor");
  }
  // 密码门通过后重新渲染，确保 autoImport 写入的数据可见
  if (typeof render === 'function') render();
  if (typeof updateHiddenBtn === 'function') updateHiddenBtn();
}
document.getElementById("gateInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") checkGate();
});
// 页面加载时检查是否已验证
if (sessionStorage.getItem("priority_authed") === "1") {
  document.getElementById("gateOverlay").style.display = "none";
  onGatePassed();
}
// ====== 数据区：手动维护，直接在此增删改 ======
// type: "合作办学" | "联考"
// tags: 从 [关系稳定, 业务合作, 录取率高, 关注度高, 录取案例, 潜力项目] 中选填
// note 支持页面内点击编辑按钮修改，保存后持久化到 localStorage
// posters（海报）支持页面上传，base64 存 localStorage
const PROJECTS = [
  { type: "合作办学", school: "中国人民大学", major: "金融学硕士", foreign: "加拿大女王大学", tags: ["关系稳定","业务合作","录取率高","录取案例"], note: "国际班0-5年经验，年招90人，周末授课" },
  { type: "合作办学", school: "对外经济贸易大学", major: "企业管理硕士", foreign: "法国巴黎第一大学", tags: ["关系稳定","关注度高","录取案例"], note: "全英文笔试+面试，年招90人" },
  { type: "合作办学", school: "南开大学", major: "国际经贸关系硕士", foreign: "澳大利亚弗林德斯大学", tags: ["关系稳定","业务合作","录取率高","录取案例"], note: "14万/全程，年招170人，接受专科报考" },
  { type: "合作办学", school: "电子科技大学", major: "数据与人工智能管理理学硕士", foreign: "法国格勒诺布尔经济管理学院", tags: ["潜力项目","录取案例"], note: "新批项目，2026年首招" },
  { type: "合作办学", school: "广西民族大学", major: "人工智能战略管理博士", foreign: "韩国首尔科学综合大学院大学", tags: ["潜力项目","录取案例"], note: "广西首个研究生层次中外合作办学机构，年招60人" },
  { type: "合作办学", school: "中央财经大学", major: "经济学与数据科学硕士", foreign: "新加坡管理大学", tags: ["关注度高","录取案例"], note: "15万/年，2年制，年招120人" },
  { type: "合作办学", school: "西安交通大学", major: "创业与创新(大数据与人工智能管理)硕士", foreign: "法国SKEMA商学院", tags: ["关注度高","潜力项目"], note: "28.8万总价，8月7日有官方直播" },
  { type: "联考", school: "北京大学", major: "工商管理硕士(MBA)", foreign: "", tags: ["关注度高","录取案例"], note: "全日制/非全日制，竞争激烈" },
  { type: "联考", school: "清华大学", major: "工程管理硕士(MEM)", foreign: "", tags: ["关注度高","潜力项目"], note: "近年热度上升，适合工科背景" },
  { type: "联考", school: "复旦大学", major: "工商管理硕士(MBA)", foreign: "", tags: ["关注度高","录取案例"], note: "提前面试制，国际班选项多" },
  { type: "联考", school: "上海财经大学", major: "工商管理硕士(MBA)", foreign: "", tags: ["潜力项目"], note: "财经类强校，性价比高" },
];
// ====== 数据区结束 ======

const TAGS = ["关系稳定","业务合作","录取率高","关注度高","录取案例","潜力项目"];
const MAX_POSTERS = 2;

// ====== localStorage 持久化 ======
// key: "priority_notes" -> { "school|major": "备注文本" }
// key: "priority_posters" -> { "school|major": ["base64data", ...] }
// key: "priority_custom" -> [ { type, school, major, foreign, tags, note } ]  页面新增的项目
const STORAGE_NOTES_KEY = "priority_notes";
const STORAGE_POSTERS_KEY = "priority_posters";
const STORAGE_CUSTOM_KEY = "priority_custom";
const STORAGE_HIDDEN_KEY = "priority_hidden"; // 被隐藏的内置项目 key 列表
const STORAGE_OVERRIDE_KEY = "priority_proj_overrides"; // 内置项目字段覆盖 { "school|major": { type, foreign, major, tags } }

function projKey(p) {
  return (p.school || "") + "|" + (p.major || "");
}

function loadCustomProjects() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_CUSTOM_KEY) || "[]");
  } catch(e) { return []; }
}

function saveCustomProjects(arr) {
  localStorage.setItem(STORAGE_CUSTOM_KEY, JSON.stringify(arr));
}

function loadHidden() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_HIDDEN_KEY) || "[]");
  } catch(e) { return []; }
}

function saveHidden(arr) {
  localStorage.setItem(STORAGE_HIDDEN_KEY, JSON.stringify(arr));
}

function loadProjOverrides() {
  try { return JSON.parse(localStorage.getItem(STORAGE_OVERRIDE_KEY) || "{}"); }
  catch(e) { return {}; }
}
function saveProjOverride(key, data) {
  const all = loadProjOverrides();
  all[key] = data;
  localStorage.setItem(STORAGE_OVERRIDE_KEY, JSON.stringify(all));
}
function deleteProjOverride(key) {
  const all = loadProjOverrides();
  delete all[key];
  localStorage.setItem(STORAGE_OVERRIDE_KEY, JSON.stringify(all));
}

function loadOverrides() {
  let notes = {}, posters = {};
  try {
    notes = JSON.parse(localStorage.getItem(STORAGE_NOTES_KEY) || "{}");
    posters = JSON.parse(localStorage.getItem(STORAGE_POSTERS_KEY) || "{}");
  } catch(e) {}
  return { notes, posters };
}

// 按 key 查找项目（含内置 + 自建），返回项目对象或 null
function findProjectByKey(key) {
  const [school, major] = key.split("|");
  const all = [...PROJECTS, ...loadCustomProjects()];
  return all.find(p => p.school === school && p.major === major);
}

function saveNote(key, text) {
  const overrides = loadOverrides();
  overrides.notes[key] = text;
  localStorage.setItem(STORAGE_NOTES_KEY, JSON.stringify(overrides.notes));
}

function savePosters(key, arr) {
  const overrides = loadOverrides();
  overrides.posters[key] = arr;
  localStorage.setItem(STORAGE_POSTERS_KEY, JSON.stringify(overrides.posters));
}

// 合并：内置 PROJECTS + 自建项目 + overrides/notes/posters 覆盖，排除已隐藏
function getMergedProjects() {
  const { notes, posters } = loadOverrides();
  const projOverrides = loadProjOverrides();
  const custom = loadCustomProjects();
  const hidden = new Set(loadHidden());
  const all = [...PROJECTS, ...custom.map(p => ({ ...p, _custom: true }))];
  return all
    .filter(p => !hidden.has(projKey(p)))
    .map(p => {
      const k = projKey(p);
      const ov = projOverrides[k];
      const merged = {
        ...p,
        _origKey: k,
        note: notes[k] !== undefined ? notes[k] : (p.note || ""),
        posters: posters[k] ? [...posters[k]] : []
      };
      if (ov) {
        merged._overridden = true;
        if (ov.type !== undefined) merged.type = ov.type;
        if (ov.foreign !== undefined) merged.foreign = ov.foreign;
        if (ov.major !== undefined) merged.major = ov.major;
        if (ov.tags !== undefined) merged.tags = ov.tags;
      }
      return merged;
    });
}

const state = {
  type: "all",
  tags: new Set(),
  search: "",
};

function render() {
  const tbody = document.getElementById("dataBody");
  const allProjects = getMergedProjects();
  let list = allProjects;

  if (state.type !== "all") {
    list = list.filter(p => p.type === state.type);
  }
  if (state.tags.size > 0) {
    list = list.filter(p => {
      for (const t of state.tags) {
        if (!p.tags.includes(t)) return false;
      }
      return true;
    });
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(p =>
      p.school.toLowerCase().includes(q) ||
      p.major.toLowerCase().includes(q) ||
      (p.foreign && p.foreign.toLowerCase().includes(q))
    );
  }

  document.getElementById("resultCount").textContent = list.length;
  document.getElementById("totalCount").textContent = allProjects.length;

  if (list.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="7">没有符合条件的项目</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(p => {
    const overLimit = p.tags.length > 4;
    const tagHtml = p.tags.map(t =>
      `<span class="tag tag-${t}${overLimit ? " tag-over-limit" : ""}">${t}</span>`
    ).join("");
    const typeHtml = `<span class="type-badge ${p.type}">${p.type}</span>`;
    const foreignHtml = p.foreign
      ? `<span class="foreign-cell">${p.foreign}</span>`
      : '<span class="foreign-cell" style="color:#bbb">—</span>';
    const isCustom = p._custom === true;
    const schoolHtml = p.school;

    // 海报缩略图
    const posters = p.posters || [];
    const k = p._origKey || projKey(p);
    let posterHtml = '<div class="poster-grid">';
    posters.forEach((src, i) => {
      posterHtml += `<div class="poster-thumb" data-src="${src}">
        <img src="${src}" alt="海报${i+1}">
        <button class="remove-btn" data-key="${k}" data-idx="${i}">&times;</button>
      </div>`;
    });
    if (posters.length < MAX_POSTERS) {
      posterHtml += `<label class="poster-add" data-key="${k}">
        +
        <input type="file" accept="image/*" data-key="${k}">
      </label>`;
    }
    posterHtml += '</div>';

    const noteText = p.note || "";
    const noteHtml = `<div class="note-view">
      <span class="note-text${noteText ? "" : " empty"}">${noteText || "暂无备注"}</span>
      <button class="note-edit-btn edit-proj-btn" data-key="${k}" data-custom="${isCustom ? "1" : "0"}">编辑</button>
      <button class="delete-proj-btn admin-only" data-key="${k}" data-custom="${isCustom ? "1" : "0"}" title="删除${isCustom ? "自建项目" : "内置项目（隐藏，可恢复）"}">删除</button>
    </div>`;

    return `<tr>
      <td>${typeHtml}</td>
      <td class="school-cell">${schoolHtml}</td>
      <td>${foreignHtml}</td>
      <td class="major-cell">${p.major}</td>
      <td><div class="tag-list">${tagHtml}</div></td>
      <td class="note-cell" data-key="${k}">${noteHtml}</td>
      <td class="poster-cell">${posterHtml}</td>
    </tr>`;
  }).join("");

  bindRowEvents();
}

function updateHiddenBtn() {
  const hidden = loadHidden();
  const btn = document.getElementById("restoreBtn");
  if (hidden.length > 0 && isAdmin()) {
    btn.style.display = "";
    btn.textContent = "↩ 恢复已隐藏(" + hidden.length + ")";
  } else {
    btn.style.display = "none";
  }
}

function bindRowEvents() {
  // 编辑项目按钮（打开编辑弹窗）
  document.querySelectorAll(".edit-proj-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      openEditModal(btn.dataset.key, btn.dataset.custom === "1");
    });
  });

  // 删除项目（自建直接删，内置加入隐藏列表）
  document.querySelectorAll(".delete-proj-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      const isCustom = btn.dataset.custom === "1";
      const [school, major] = key.split("|");
      const msg = isCustom
        ? "确认删除「" + school + " - " + major + "」？\n该自建项目的备注和海报数据也会一并清除。"
        : "确认隐藏内置项目「" + school + " - " + major + "」？\n隐藏后可通过工具栏「恢复」按钮找回。";
      if (!confirm(msg)) return;

      if (isCustom) {
        const custom = loadCustomProjects();
        const filtered = custom.filter(p => !(p.school === school && p.major === major));
        saveCustomProjects(filtered);
        // 自建项目删除：清理 notes/posters/override
        const overrides = loadOverrides();
        delete overrides.notes[key];
        delete overrides.posters[key];
        localStorage.setItem(STORAGE_NOTES_KEY, JSON.stringify(overrides.notes));
        localStorage.setItem(STORAGE_POSTERS_KEY, JSON.stringify(overrides.posters));
        deleteProjOverride(key);
      } else {
        // 内置项目：仅加入隐藏列表，保留 override/notes/posters 以便恢复
        const hidden = loadHidden();
        if (!hidden.includes(key)) {
          hidden.push(key);
          saveHidden(hidden);
        }
      }
      render();
      updateHiddenBtn();
    });
  });

  // 海报上传
  document.querySelectorAll(".poster-add input[type=file]").forEach(input => {
    input.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const key = input.dataset.key;

      const reader = new FileReader();
      reader.onload = function(ev) {
        const base64 = ev.target.result;
        const overrides = loadOverrides();
        const arr = overrides.posters[key] ? [...overrides.posters[key]] : [];
        if (arr.length >= MAX_POSTERS) return;
        arr.push(base64);
        savePosters(key, arr);
        render();
      };
      reader.readAsDataURL(file);
    });
  });

  // 海报缩略图点击预览
  document.querySelectorAll(".poster-thumb img").forEach(img => {
    img.addEventListener("click", () => {
      const src = img.parentElement.dataset.src;
      document.getElementById("modalImg").src = src;
      document.getElementById("posterModal").classList.add("show");
    });
  });

  // 海报删除
  document.querySelectorAll(".poster-thumb .remove-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const key = btn.dataset.key;
      const idx = parseInt(btn.dataset.idx);
      const overrides = loadOverrides();
      const arr = overrides.posters[key] ? [...overrides.posters[key]] : [];
      arr.splice(idx, 1);
      savePosters(key, arr);
      render();
    });
  });
}

// 弹窗关闭
document.getElementById("modalClose").addEventListener("click", () => {
  document.getElementById("posterModal").classList.remove("show");
});
document.getElementById("posterModal").addEventListener("click", (e) => {
  if (e.target.id === "posterModal") {
    document.getElementById("posterModal").classList.remove("show");
  }
});

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    state.type = tab.dataset.type;
    render();
  });
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const tag = chip.dataset.tag;
    if (state.tags.has(tag)) {
      state.tags.delete(tag);
      chip.classList.remove("active");
    } else {
      state.tags.add(tag);
      chip.classList.add("active");
    }
    render();
  });
});

document.getElementById("clearTags").addEventListener("click", () => {
  state.tags.clear();
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  render();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  state.search = e.target.value;
  render();
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const allProjects = getMergedProjects();
  const headers = ["类型","学校","外方院校","专业","标签","备注"];
  const rows = [headers.join(",")];
  const visible = allProjects.filter(p => {
    if (state.type !== "all" && p.type !== state.type) return false;
    if (state.tags.size > 0) {
      for (const t of state.tags) if (!p.tags.includes(t)) return false;
    }
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!p.school.toLowerCase().includes(q) && !p.major.toLowerCase().includes(q) && !(p.foreign && p.foreign.toLowerCase().includes(q))) return false;
    }
    return true;
  });
  visible.forEach(p => {
    const row = [
      p.type,
      p.school,
      p.foreign || "",
      p.major,
      p.tags.join("/"),
      (p.note || "").replace(/,/g, "，"),
    ].map(v => `"${v}"`);
    rows.push(row.join(","));
  });
  const csv = "\uFEFF" + rows.join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "重点项目清单_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

// 恢复已隐藏的内置项目
document.getElementById("restoreBtn").addEventListener("click", () => {
  const hidden = loadHidden();
  if (hidden.length === 0) return;
  if (!confirm("确认恢复 " + hidden.length + " 个已隐藏项目？")) return;
  saveHidden([]);
  render();
  updateHiddenBtn();
});

let RADAR_PROJECTS = RADAR_PROJECTS_RAW;
let RADAR_SCHOOL_MAP = new Map(); // school -> [{name, foreign}]
let RADAR_SCHOOLS = [];
let RADAR_MAJOR_INDEX = new Map(); // major -> [{school, foreign}]
let RADAR_FOREIGN_INDEX = new Map(); // foreign -> [{school, name}]
let RADAR_FOREIGN_LIST = [];

function loadRadarProjects() {
  // 数据已内嵌，无需 fetch；保留函数名以便向后兼容
  RADAR_PROJECTS = RADAR_PROJECTS_RAW;
  buildRadarIndex();
}

function buildRadarIndex() {
  RADAR_SCHOOL_MAP = new Map();
  RADAR_MAJOR_INDEX = new Map();
  RADAR_FOREIGN_INDEX = new Map();
  const foreignSet = new Set();

  RADAR_PROJECTS.forEach(p => {
    if (!p) return;
    const school = (p.school || "").trim();
    const name = (p.name || "").trim();
    const foreign = (p.foreign || "").trim();

    if (school) {
      if (!RADAR_SCHOOL_MAP.has(school)) RADAR_SCHOOL_MAP.set(school, []);
      RADAR_SCHOOL_MAP.get(school).push({ name, foreign });
    }

    if (name) {
      if (!RADAR_MAJOR_INDEX.has(name)) RADAR_MAJOR_INDEX.set(name, []);
      RADAR_MAJOR_INDEX.get(name).push({ school, foreign });
    }

    if (foreign) {
      foreignSet.add(foreign);
      if (!RADAR_FOREIGN_INDEX.has(foreign)) RADAR_FOREIGN_INDEX.set(foreign, []);
      RADAR_FOREIGN_INDEX.get(foreign).push({ school, name });
    }
  });

  RADAR_SCHOOLS = [...RADAR_SCHOOL_MAP.keys()].sort();
  RADAR_FOREIGN_LIST = [...foreignSet].sort();
}

// 自动补全组件
function createAutocomplete(input, listEl, onSelect) {
  let items = [];
  let activeIdx = -1;

  function position() {
    const rect = input.getBoundingClientRect();
    listEl.style.top = (rect.bottom + window.scrollY) + "px";
    listEl.style.left = (rect.left + window.scrollX) + "px";
    listEl.style.width = rect.width + "px";
  }

  function render() {
    if (items.length === 0) {
      listEl.classList.remove("show");
      listEl.innerHTML = "";
      return;
    }
    listEl.innerHTML = items.map((it, i) => {
      const text = typeof it === "string" ? it : it.text;
      const sub = typeof it === "string" ? "" : it.sub;
      return `<div class="autocomplete-item${i === activeIdx ? " active" : ""}" data-idx="${i}">
        <div>${escapeHtml(text)}</div>
        ${sub ? `<div class="sub">${escapeHtml(sub)}</div>` : ""}
      </div>`;
    }).join("");
    position();
    listEl.classList.add("show");
    listEl.querySelectorAll(".autocomplete-item").forEach(el => {
      el.addEventListener("click", () => {
        const idx = parseInt(el.dataset.idx);
        onSelect(items[idx]);
        close();
      });
    });
  }

  function close() {
    items = [];
    activeIdx = -1;
    listEl.classList.remove("show");
    listEl.innerHTML = "";
  }

  input.addEventListener("input", () => {
    const q = input.value.trim();
    items = suggestItems(input.id, q);
    activeIdx = -1;
    render();
  });

  input.addEventListener("focus", () => {
    items = suggestItems(input.id, input.value.trim());
    activeIdx = -1;
    render();
  });

  input.addEventListener("keydown", (e) => {
    if (!listEl.classList.contains("show")) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeIdx = (activeIdx + 1) % items.length;
      render();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIdx = (activeIdx - 1 + items.length) % items.length;
      render();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (activeIdx >= 0 && activeIdx < items.length) {
        onSelect(items[activeIdx]);
        close();
      }
    } else if (e.key === "Escape") {
      close();
    }
  });

  function onDocClick(e) {
    if (!input.contains(e.target) && !listEl.contains(e.target)) {
      close();
    }
  }
  document.addEventListener("click", onDocClick);

  function onScroll() {
    if (listEl.classList.contains("show")) position();
  }
  window.addEventListener("scroll", onScroll, true);
  window.addEventListener("resize", onScroll);

  return { close, destroy: () => {
    document.removeEventListener("click", onDocClick);
    window.removeEventListener("scroll", onScroll, true);
    window.removeEventListener("resize", onScroll);
  }};
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function suggestItems(inputId, q) {
  const lower = q.toLowerCase();
  const isEdit = inputId.startsWith("edit");
  const schoolInputId = isEdit ? "editSchool" : "addSchool";

  if (inputId === "addSchool" || inputId === "editSchool") {
    const direct = RADAR_SCHOOLS.filter(s => s.toLowerCase().includes(lower));
    const seen = new Set(direct);
    const aliasMatches = [];
    Object.entries(SCHOOL_ALIASES).forEach(([alias, schools]) => {
      if (alias.toLowerCase().includes(lower) || lower.includes(alias.toLowerCase())) {
        schools.forEach(school => {
          if (!seen.has(school)) {
            seen.add(school);
            aliasMatches.push({ text: school, sub: "匹配：" + alias });
          }
        });
      }
    });
    return [...direct.map(s => ({ text: s })), ...aliasMatches].slice(0, 10);
  }

  if (inputId === "addMajor" || inputId === "editMajor") {
    const school = document.getElementById(schoolInputId).value.trim();
    const arr = [];

    if (school && RADAR_SCHOOL_MAP.has(school)) {
      // 学校已填：优先显示该校所有专业
      const list = RADAR_SCHOOL_MAP.get(school);
      const seen = new Set();
      list.forEach(p => {
        if (!p.name || seen.has(p.name)) return;
        seen.add(p.name);
        if (!q || p.name.toLowerCase().includes(lower)) {
          const sameMajor = list.filter(x => x.name === p.name);
          const foreigns = [...new Set(sameMajor.map(x => x.foreign).filter(Boolean))];
          arr.push({ text: p.name, sub: foreigns.join(" / ") || "", _meta: sameMajor });
        }
      });
    } else {
      // 学校未填：全局匹配
      RADAR_MAJOR_INDEX.forEach((matches, major) => {
        if (!q || major.toLowerCase().includes(lower)) {
          const sub = matches.slice(0, 2).map(m =>
            (m.school || "") + (m.foreign ? " · " + m.foreign : "")
          ).join("；") + (matches.length > 2 ? " 等" + matches.length + "个项目" : "");
          arr.push({ text: major, sub, _meta: matches });
        }
      });
    }
    return arr.slice(0, 10);
  }

  if (inputId === "addForeign" || inputId === "editForeign") {
    const school = document.getElementById(schoolInputId).value.trim();
    const arr = [];

    if (school && RADAR_SCHOOL_MAP.has(school)) {
      // 学校已填：优先显示该校所有外方院校
      const list = RADAR_SCHOOL_MAP.get(school);
      const seen = new Set();
      list.forEach(p => {
        if (!p.foreign || seen.has(p.foreign)) return;
        seen.add(p.foreign);
        if (!q || p.foreign.toLowerCase().includes(lower)) {
          const sameForeign = list.filter(x => x.foreign === p.foreign);
          const majors = [...new Set(sameForeign.map(x => x.name).filter(Boolean))];
          arr.push({ text: p.foreign, sub: majors.join(" / ") || "", _meta: sameForeign });
        }
      });
    } else {
      // 学校未填：全局匹配
      RADAR_FOREIGN_INDEX.forEach((matches, foreign) => {
        if (!q || foreign.toLowerCase().includes(lower)) {
          const sub = matches.slice(0, 2).map(m =>
            (m.school || "") + (m.name ? " · " + m.name : "")
          ).join("；") + (matches.length > 2 ? " 等" + matches.length + "个项目" : "");
          arr.push({ text: foreign, sub, _meta: matches });
        }
      });
    }
    return arr.slice(0, 10);
  }

  if (inputId === "addProjectSearch") {
    return suggestProjectSearch(q);
  }

  return [];
}

// 全局项目搜索：可同时匹配学校、外方、专业
function suggestProjectSearch(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (terms.length === 0) return [];

  const matches = RADAR_PROJECTS.filter(p => {
    const text = (p.school + " " + p.foreign + " " + p.name).toLowerCase();
    return terms.every(t => text.includes(t));
  });

  // 去重（同一学校+专业+外方）
  const seen = new Set();
  const arr = [];
  matches.forEach(p => {
    const key = (p.school || "") + "|" + (p.foreign || "") + "|" + (p.name || "");
    if (seen.has(key)) return;
    seen.add(key);
    arr.push({
      text: p.school + " · " + p.name,
      sub: p.foreign || "",
      _meta: p
    });
  });

  return arr.slice(0, 10);
}

      return;
    }

    // 检查重复（学校+专业）
    const k = school + "|" + major;
    const all = getMergedProjects();
    if (all.some(p => projKey(p) === k)) {
      alert("已存在相同学校+专业的项目，请勿重复添加");
      return;
    }

    const custom = loadCustomProjects();
    custom.push({ type, school, major, foreign, tags, note });
    saveCustomProjects(custom);
    closeAddModal();
    render();
  });
}

function closeAddModal() {
  document.getElementById("addModal").classList.remove("show");
  // 清空表单
  document.getElementById("addProjectSearch").value = "";
  document.getElementById("addSchool").value = "";
  document.getElementById("addForeign").value = "";
  document.getElementById("addMajor").value = "";
  document.getElementById("addMajorSelect").value = "";
  document.getElementById("addNote").value = "";
  document.querySelectorAll("#addTagChecks input:checked").forEach(c => c.checked = false);
  document.querySelector('input[name="addType"][value="合作办学"]').checked = true;
  document.getElementById("tagCountHint").textContent = "建议不超过 4 个";
  document.getElementById("tagCountHint").classList.remove("over");
  updateModalForType("合作办学");
}

// ====== 编辑项目弹窗 ======
let _editKey = null;
let _editIsCustom = false;

function updateEditModalForType(type) {
  const foreignRow = document.getElementById("editForeignRow");
  const majorInputWrap = document.getElementById("editMajorInputWrap");
  const editMajor = document.getElementById("editMajor");
  const editMajorSelect = document.getElementById("editMajorSelect");
  const editForeign = document.getElementById("editForeign");

  if (type === "合作办学") {
    foreignRow.style.display = "";
    majorInputWrap.style.display = "";
    editMajor.style.display = "";
    editMajorSelect.style.display = "none";
    editMajorSelect.value = "";
    editForeign.placeholder = "合作办学填写外方院校";
  } else {
    foreignRow.style.display = "none";
    majorInputWrap.style.display = "none";
    editMajor.value = "";
    editMajorSelect.style.display = "";
    editForeign.value = "";
  }
}

function updateEditTagHint() {
  const checked = document.querySelectorAll("#editTagChecks input:checked").length;
  const hint = document.getElementById("editTagCountHint");
  hint.textContent = "已选 " + checked + " 个，建议不超过 4 个";
  hint.classList.toggle("over", checked > 4);
}

function openEditModal(key, isCustom) {
  _editKey = key;
  _editIsCustom = isCustom;

  const all = getMergedProjects();
  const proj = all.find(p => (p._origKey || projKey(p)) === key);
  if (!proj) return;

  document.getElementById("editSchool").value = proj.school;
  document.querySelector('input[name="editType"][value="' + proj.type + '"]').checked = true;
  document.getElementById("editForeign").value = proj.foreign || "";
  document.getElementById("editMajor").value = proj.major || "";
  document.getElementById("editMajorSelect").value = (proj.type === "联考") ? (proj.major || "") : "";
  document.getElementById("editNote").value = proj.note || "";

  document.querySelectorAll("#editTagChecks input").forEach(c => {
    c.checked = proj.tags.includes(c.value);
  });
  updateEditTagHint();
  updateEditModalForType(proj.type);
  document.getElementById("editModal").classList.add("show");
}

function closeEditModal() {
  document.getElementById("editModal").classList.remove("show");
  _editKey = null;
  _editIsCustom = false;
}

function initEditModal() {
  const tagChecks = document.getElementById("editTagChecks");
  tagChecks.innerHTML = TAGS.map(t =>
    '<label class="tag-check"><input type="checkbox" value="' + t + '"> ' + t + '</label>'
  ).join("");

  tagChecks.addEventListener("change", updateEditTagHint);

  document.querySelectorAll('input[name="editType"]').forEach(radio => {
    radio.addEventListener("change", () => updateEditModalForType(radio.value));
  });

  // 专业自动补全
  createAutocomplete(
    document.getElementById("editMajor"),
    document.getElementById("editMajorSuggest"),
    (item) => {
      const val = typeof item === "string" ? item : item.text;
      const meta = (typeof item === "object" && item._meta) ? item._meta : [];
      document.getElementById("editMajor").value = val;
      const school = document.getElementById("editSchool").value.trim();
      let matches = meta;
      if (school) matches = matches.filter(m => m.school === school);
      if (matches.length >= 1) {
        const foreigns = [...new Set(matches.map(m => m.foreign).filter(Boolean))];
        if (foreigns.length && !document.getElementById("editForeign").value.trim()) {
          document.getElementById("editForeign").value = foreigns.join(" / ");
        }
      }
    }
  );

  // 外方自动补全
  createAutocomplete(
    document.getElementById("editForeign"),
    document.getElementById("editForeignSuggest"),
    (item) => {
      const val = typeof item === "string" ? item : item.text;
      document.getElementById("editForeign").value = val;
    }
  );

  document.getElementById("editCancelBtn").addEventListener("click", closeEditModal);
  document.getElementById("editModal").addEventListener("click", (e) => {
    if (e.target.id === "editModal") closeEditModal();
  });

  document.getElementById("editSaveBtn").addEventListener("click", () => {
    if (!_editKey) return;
    const type = document.querySelector('input[name="editType"]:checked').value;
    const school = document.getElementById("editSchool").value.trim();
    const major = type === "合作办学"
      ? document.getElementById("editMajor").value.trim()
      : document.getElementById("editMajorSelect").value.trim();
    const foreign = type === "合作办学" ? document.getElementById("editForeign").value.trim() : "";
    const note = document.getElementById("editNote").value.trim();
    const tags = Array.from(document.querySelectorAll("#editTagChecks input:checked")).map(c => c.value);

    if (!major) { alert("请填写专业"); return; }

    const newKey = school + "|" + major;

    if (_editIsCustom) {
      const custom = loadCustomProjects();
      const idx = custom.findIndex(p => (p.school + "|" + p.major) === _editKey);
      if (idx >= 0) {
        custom[idx] = { ...custom[idx], type, school, major, foreign, tags, note };
        saveCustomProjects(custom);
      }
      // 清除可能存在的旧 notes 覆盖（自建项目以 custom 记录的 note 为准）
      const overrides = loadOverrides();
      let needSave = false;
      if (overrides.notes[_editKey] !== undefined) {
        delete overrides.notes[_editKey];
        needSave = true;
      }
      // major 改了则迁移 posters
      if (newKey !== _editKey && overrides.posters[_editKey]) {
        overrides.posters[newKey] = overrides.posters[_editKey];
        delete overrides.posters[_editKey];
        needSave = true;
      }
      if (needSave) {
        localStorage.setItem(STORAGE_NOTES_KEY, JSON.stringify(overrides.notes));
        localStorage.setItem(STORAGE_POSTERS_KEY, JSON.stringify(overrides.posters));
      }
    } else {
      saveProjOverride(_editKey, { type, foreign, major, tags });
      saveNote(_editKey, note);
    }

    closeEditModal();
    render();
  });
}

initEditModal();

initAddModal();
render();
updateHiddenBtn();

// ====== 数据导入/导出 ======
const DATA_KEYS = [STORAGE_NOTES_KEY, STORAGE_POSTERS_KEY, STORAGE_CUSTOM_KEY, STORAGE_HIDDEN_KEY, STORAGE_OVERRIDE_KEY];

document.getElementById("exportDataBtn").addEventListener("click", () => {
  const data = {};
  DATA_KEYS.forEach(k => { data[k] = localStorage.getItem(k); });
  const json = JSON.stringify(data);
  // 复制到剪贴板
  navigator.clipboard.writeText(json).then(() => {
    alert("数据已复制到剪贴板！\n请到另一个版本的页面点击「导入数据」粘贴。");
  }).catch(() => {
    // 降级：弹窗显示
  prompt("请复制以下数据（Ctrl+A 全选 → Ctrl+C 复制）：", json);
  });
});

document.getElementById("importDataBtn").addEventListener("click", () => {
  document.getElementById("importTextarea").value = "";
  document.getElementById("importModal").classList.add("show");
});
document.getElementById("importCloseBtn").addEventListener("click", () => {
  document.getElementById("importModal").classList.remove("show");
});
document.getElementById("importCancelBtn").addEventListener("click", () => {
  document.getElementById("importModal").classList.remove("show");
});
document.getElementById("importModal").addEventListener("click", (e) => {
  if (e.target.id === "importModal") document.getElementById("importModal").classList.remove("show");
});
document.getElementById("importConfirmBtn").addEventListener("click", () => {
  const text = document.getElementById("importTextarea").value.trim();
  if (!text) { alert("请粘贴数据"); return; }
  try {
    const data = JSON.parse(text);
    let count = 0;
    DATA_KEYS.forEach(k => {
      if (data[k] !== undefined && data[k] !== null) {
        // 合并：如果已有数据，合并而非覆盖
        if (k === STORAGE_NOTES_KEY || k === STORAGE_POSTERS_KEY || k === STORAGE_OVERRIDE_KEY) {
          try {
            const existing = JSON.parse(localStorage.getItem(k) || "{}");
            const incoming = JSON.parse(data[k]);
            const merged = { ...existing, ...incoming };
            localStorage.setItem(k, JSON.stringify(merged));
          } catch(e) {
            localStorage.setItem(k, data[k]);
          }
        } else if (k === STORAGE_CUSTOM_KEY || k === STORAGE_HIDDEN_KEY) {
          try {
            const existing = JSON.parse(localStorage.getItem(k) || "[]");
            const incoming = JSON.parse(data[k]);
            const merged = [...existing, ...incoming];
            localStorage.setItem(k, JSON.stringify(merged));
          } catch(e) {
            localStorage.setItem(k, data[k]);
          }
        }
        count++;
      }
    });
    document.getElementById("importModal").classList.remove("show");
    alert("导入成功！共恢复 " + count + " 项数据。");
    render();
    updateHiddenBtn();
  } catch(e) {
    alert("数据格式错误，请检查后重试：" + e.message);
  }
});

// ====== URL Hash 自动导入 ======
(function autoImport() {
  const hash = window.location.hash;
  if (!hash || !hash.startsWith('#import=')) return;
  const b64 = hash.substring(8);
  try {
    const json = atob(b64);
    const text = decodeURIComponent(escape(json));
    const data = JSON.parse(text);
    let count = 0;
    DATA_KEYS.forEach(k => {
      if (data[k] !== undefined && data[k] !== null) {
        if (k === STORAGE_NOTES_KEY || k === STORAGE_POSTERS_KEY || k === STORAGE_OVERRIDE_KEY) {
          try {
            const existing = JSON.parse(localStorage.getItem(k) || "{}");
            const incoming = JSON.parse(data[k]);
            const merged = { ...existing, ...incoming };
            localStorage.setItem(k, JSON.stringify(merged));
          } catch(e) {
            localStorage.setItem(k, data[k]);
          }
        } else if (k === STORAGE_CUSTOM_KEY || k === STORAGE_HIDDEN_KEY) {
          try {
            const existing = JSON.parse(localStorage.getItem(k) || "[]");
            const incoming = JSON.parse(data[k]);
            const merged = [...existing, ...incoming];
            localStorage.setItem(k, JSON.stringify(merged));
          } catch(e) {
            localStorage.setItem(k, data[k]);
          }
        }
        count++;
      }
    });
    // 清除hash，避免刷新时重复导入
    history.replaceState(null, '', window.location.pathname);
    render();
    updateHiddenBtn();
    setTimeout(() => alert("数据已自动恢复！共导入 " + count + " 项。"), 500);
  } catch(e) {
    console.error("自动导入失败:", e);
    setTimeout(() => alert("自动导入失败: " + e.message), 500);
  }
})();
</script>
