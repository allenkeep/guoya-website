<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中外合作办学硕士 · 字段筛选</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f6f8;
  color: #1a1a2e;
  line-height: 1.6;
}
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 20px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.header h1 { font-size: 20px; font-weight: 700; }
.header .sub { font-size: 13px; opacity: 0.85; margin-top: 2px; }
.header .stats { font-size: 13px; margin-top: 6px; opacity: 0.9; }
.header .stats b { font-size: 16px; }

.layout {
  display: flex;
  gap: 0;
  max-width: 1400px;
  margin: 0 auto;
  align-items: flex-start;
}
.filters {
  width: 300px;
  flex-shrink: 0;
  background: #fff;
  border-right: 1px solid #e8e8ec;
  padding: 20px;
  position: sticky;
  top: 72px;
  height: calc(100vh - 72px);
  overflow-y: auto;
  align-self: flex-start;
}
.results {
  flex: 1;
  padding: 20px 24px;
  min-width: 0;
}
.filter-group {
  margin-bottom: 22px;
}
.filter-label {
  font-size: 13px;
  font-weight: 600;
  color: #555;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.filter-label .clear-link {
  font-size: 12px;
  color: #999;
  cursor: pointer;
  font-weight: 400;
}
.filter-label .clear-link:hover { color: #667eea; }
.search-input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: #667eea; }
.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  padding: 5px 12px;
  border: 1px solid #ddd;
  border-radius: 16px;
  font-size: 12.5px;
  cursor: pointer;
  user-select: none;
  transition: all 0.15s;
  background: #fff;
  color: #555;
}
.chip:hover { border-color: #667eea; color: #667eea; }
.chip.active {
  background: #667eea;
  border-color: #667eea;
  color: #fff;
}
.chip .count {
  font-size: 11px;
  opacity: 0.65;
  margin-left: 3px;
}
.fee-mode-toggle {
  display: flex;
  gap: 0;
  margin-bottom: 8px;
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
}
.fee-mode-toggle button {
  flex: 1;
  padding: 7px;
  border: none;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
  color: #666;
  transition: all 0.15s;
}
.fee-mode-toggle button.active {
  background: #667eea;
  color: #fff;
}
.fee-range {
  display: flex;
  align-items: center;
  gap: 8px;
}
.fee-range input {
  width: 80px;
  padding: 6px 8px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 13px;
  text-align: center;
  outline: none;
}
.fee-range input:focus { border-color: #667eea; }
.fee-range span { font-size: 13px; color: #999; }
.fee-range .unit { font-size: 12px; color: #999; white-space: nowrap; }
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #555;
  cursor: pointer;
  margin-top: 6px;
}
.checkbox-row input { cursor: pointer; }
.clear-all-btn {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
  font-size: 14px;
  cursor: pointer;
  color: #666;
  margin-top: 4px;
  transition: all 0.15s;
}
.clear-all-btn:hover { border-color: #e74c3c; color: #e74c3c; }
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 14px;
}
.card {
  background: #fff;
  border: 1px solid #e8e8ec;
  border-radius: 12px;
  padding: 16px;
  transition: box-shadow 0.2s, border-color 0.2s;
  cursor: pointer;
}
.card:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-color: #c5cae9;
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.card-school {
  font-size: 15px;
  font-weight: 600;
  color: #1a1a2e;
}
.card-province {
  font-size: 11px;
  background: #f0f0f5;
  color: #666;
  padding: 2px 8px;
  border-radius: 10px;
  white-space: nowrap;
}
.card-major {
  font-size: 14px;
  color: #333;
  margin-bottom: 4px;
}
.card-foreign {
  font-size: 13px;
  color: #666;
  margin-bottom: 10px;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}
.tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
}
.tag-fee { background: #fff3e0; color: #e65100; }
.tag-dur { background: #e8f5e9; color: #2e7d32; }
.tag-edu { background: #e3f2fd; color: #1565c0; }
.tag-tier-a { background: #fce4ec; color: #c62828; font-weight: 600; }
.tag-tier-na { background: #f5f5f5; color: #999; }
.tag-new { background: #ffd700; color: #b8860b; font-weight: 600; }
.tag-quota { background: #f3e5f5; color: #6a1b9a; }
.card-fee-row {
  display: flex;
  gap: 12px;
  font-size: 12px;
  color: #888;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #f0f0f0;
}
.card-fee-row span b { color: #555; }
.empty {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}
.empty h3 { font-size: 16px; margin-bottom: 6px; }
.result-count {
  font-size: 13px;
  color: #666;
  margin-bottom: 14px;
}
.result-count b { color: #667eea; font-size: 15px; }
/* modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 20px;
  overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 14px;
  max-width: 560px;
  width: 100%;
  padding: 28px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.modal-close {
  float: right;
  font-size: 22px;
  color: #ccc;
  cursor: pointer;
  line-height: 1;
}
.modal-close:hover { color: #333; }
.modal h2 { font-size: 18px; margin-bottom: 4px; padding-right: 24px; }
.modal .modal-sub { font-size: 13px; color: #888; margin-bottom: 18px; }
.modal-table { width: 100%; }
.modal-table tr { border-bottom: 1px solid #f0f0f0; }
.modal-table td { padding: 9px 0; font-size: 14px; vertical-align: top; }
.modal-table td:first-child {
  width: 90px;
  color: #999;
  font-size: 13px;
  white-space: nowrap;
}
.modal-table td:last-child { color: #333; }
@media (max-width: 768px) {
  .layout { flex-direction: column; }
  .filters { width: 100%; position: relative; top: 0; height: auto; border-right: none; border-bottom: 1px solid #e8e8ec; }
  .card-grid { grid-template-columns: 1fr; }
}

/* Edit modal */
.edit-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 20px;
  overflow-y: auto;
}
.edit-overlay.show { display: flex; }
.edit-modal-box {
  background: #fff;
  border-radius: 14px;
  max-width: 520px;
  width: 100%;
  padding: 28px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.edit-modal-box h3 { font-size: 18px; margin-bottom: 4px; color: #1a202c; }
.edit-modal-box .edit-subtitle { font-size: 13px; color: #888; margin-bottom: 18px; }
.edit-field { margin-bottom: 14px; }
.edit-field label { display: block; font-size: 13px; color: #718096; margin-bottom: 4px; font-weight: 500; }
.edit-field input, .edit-field textarea, .edit-field select {
  width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
  font-size: 14px; outline: none; font-family: inherit; transition: border .2s; background: #fff;
}
.edit-field input:focus, .edit-field textarea:focus, .edit-field select:focus { border-color: #667eea; }
.edit-field textarea { min-height: 60px; resize: vertical; }
.edit-password { margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 14px; }
.edit-password label { font-size: 13px; color: #e53e3e; margin-bottom: 4px; display: block; font-weight: 500; }
.edit-password input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; transition: border .2s; }
.edit-password input:focus { border-color: #e53e3e; }
.edit-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.edit-btn { padding: 8px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; transition: all .15s; font-weight: 500; }
.edit-btn.cancel { background: #f0f3f7; color: #718096; }
.edit-btn.cancel:hover { background: #e2e8f0; }
.edit-btn.submit { background: #667eea; color: #fff; }
.edit-btn.submit:hover { background: #5a6fd6; }
.edit-error { color: #e53e3e; font-size: 13px; margin-top: 8px; min-height: 20px; }
</style>
</head>
<body>

<div class="header">
  <h1>中外合作办学硕士 · 字段筛选</h1>
  <div class="sub">数据来源：guoya.net.cn/radar · 更新于 <span id="dataUpdated" style="font-weight:600">—</span></div>
  <div class="stats">符合条件：<b id="resultCount">—</b> / 共 <span id="totalCount">—</span> 个</div>
</div>

<div class="layout">
  <div class="filters">
    <div class="filter-group">
      <div class="filter-label">关键词搜索</div>
      <input type="text" class="search-input" id="searchInput" placeholder="学校 / 专业 / 外方院校">
    </div>

    <div class="filter-group">
      <div class="filter-label">省份 <span class="clear-link" onclick="clearFilter('province')">清除</span></div>
      <div class="chip-group" id="provinceChips"></div>
    </div>

    <div class="filter-group">
      <div class="filter-label">学历要求 <span class="clear-link" onclick="clearFilter('edu')">清除</span></div>
      <div class="chip-group" id="eduChips"></div>
    </div>

    <div class="filter-group">
      <div class="filter-label">学制 <span class="clear-link" onclick="clearFilter('dur')">清除</span></div>
      <div class="chip-group" id="durChips"></div>
    </div>

    <div class="filter-group">
      <div class="filter-label">学费区间 <span class="clear-link" onclick="clearFilter('fee')">清除</span></div>
      <div class="fee-mode-toggle">
        <button class="active" data-mode="total" onclick="setFeeMode('total')">总价</button>
        <button data-mode="annual" onclick="setFeeMode('annual')">按年</button>
      </div>
      <div class="fee-range">
        <input type="number" id="feeMin" placeholder="最低" min="0">
        <span>—</span>
        <input type="number" id="feeMax" placeholder="最高" min="0">
        <span class="unit" id="feeUnit">万</span>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="includeNoFee" checked>
        <span>包含「详询/未公布」</span>
      </label>
    </div>

    <div class="filter-group">
      <div class="filter-label">分级 <span class="clear-link" onclick="clearFilter('tier')">清除</span></div>
      <div class="chip-group" id="tierChips"></div>
    </div>

    <div class="filter-group">
      <label class="checkbox-row">
        <input type="checkbox" id="onlyNew">
        <span>只看新批项目</span>
      </label>
    </div>

    <button class="clear-all-btn" onclick="clearAll()">清空全部筛选</button>
  </div>

  <div class="results">
    <div class="result-count" id="resultCountText"></div>
    <div class="card-grid" id="cardGrid"></div>
    <div class="empty" id="emptyState" style="display:none">
      <h3>没有符合条件的项目</h3>
      <p>尝试放宽筛选条件或清空筛选</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div id="modalContent"></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="edit-overlay" id="editOverlay" onclick="if(event.target===this)closeEditModal()">
  <div class="edit-modal-box">
    <h3>更新项目信息</h3>
    <div class="edit-subtitle" id="editSubtitle"></div>
    <div class="edit-field">
      <label>学历要求</label>
      <textarea id="editEdu" rows="2"></textarea>
    </div>
    <div class="edit-field">
      <label>语言要求</label>
      <textarea id="editLang" rows="2"></textarea>
    </div>
    <div class="edit-field">
      <label>工作经验</label>
      <input type="text" id="editExp">
    </div>
    <div class="edit-field">
      <label>招生人数</label>
      <input type="text" id="editQuota">
    </div>
    <div class="edit-field">
      <label>学制</label>
      <input type="text" id="editDur">
    </div>
    <div class="edit-field">
      <label>学费</label>
      <input type="text" id="editFee" placeholder="如：19.8万">
    </div>
    <div class="edit-field">
      <label>分级</label>
      <select id="editTier">
        <option value="A+">A+</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="暂未分级">暂未分级</option>
      </select>
    </div>
    <div class="edit-password">
      <label>请输入密码以确认更新</label>
      <input type="password" id="editPassword" placeholder="密码">
    </div>
    <div class="edit-error" id="editError"></div>
    <div class="edit-actions">
      <button class="edit-btn cancel" onclick="closeEditModal()">取消</button>
      <button class="edit-btn submit" onclick="submitEdit()">确认更新</button>
    </div>
  </div>
</div>

function getFeeNum(p) {

  if (state.feeMode === 'annual') {
    return p.fee_per_year ? p.fee_num : null;
  } else {
    return p.fee_per_year ? null : p.fee_num;
  }
}

function buildChips() {
  // Provinces
  const provinces = {};
  PROJECTS.forEach(p => { provinces[p.province] = (provinces[p.province]||0)+1; });
  const provEl = document.getElementById('provinceChips');
  Object.keys(provinces).sort((a,b) => provinces[b]-provinces[a]).forEach(prov => {
    const el = document.createElement('span');
    el.className = 'chip';
    el.dataset.value = prov;
    el.innerHTML = prov + '<span class="count">' + provinces[prov] + '</span>';
    el.onclick = () => toggleChip('province', prov, el);
    provEl.appendChild(el);
  });

  // Edu categories
  const edus = {};
  PROJECTS.forEach(p => { edus[p.edu_cat] = (edus[p.edu_cat]||0)+1; });
  const eduEl = document.getElementById('eduChips');
  Object.keys(edus).sort((a,b) => edus[b]-edus[a]).forEach(cat => {
    const el = document.createElement('span');
    el.className = 'chip';
    el.dataset.value = cat;
    el.innerHTML = cat + '<span class="count">' + edus[cat] + '</span>';
    el.onclick = () => toggleChip('edu', cat, el);
    eduEl.appendChild(el);
  });

  // Duration
  const durOrder = ['1年','1.5年','2年','2.5年','3年','其他/灵活','待查'];
  const durs = {};
  PROJECTS.forEach(p => { durs[p.dur_cat] = (durs[p.dur_cat]||0)+1; });
  const durEl = document.getElementById('durChips');
  durOrder.forEach(cat => {
    if (!durs[cat]) return;
    const el = document.createElement('span');
    el.className = 'chip';
    el.dataset.value = cat;
    el.innerHTML = cat + '<span class="count">' + durs[cat] + '</span>';
    el.onclick = () => toggleChip('dur', cat, el);
    durEl.appendChild(el);
  });

  // Tier
  const tierOrder = ['A+','A','暂未分级'];
  const tiers = {};
  PROJECTS.forEach(p => { const t = p.tier||'暂未分级'; tiers[t] = (tiers[t]||0)+1; });
  const tierEl = document.getElementById('tierChips');
  tierOrder.forEach(cat => {
    if (!tiers[cat]) return;
    const el = document.createElement('span');
    el.className = 'chip';
    el.dataset.value = cat;
    el.innerHTML = cat + '<span class="count">' + tiers[cat] + '</span>';
    el.onclick = () => toggleChip('tier', cat, el);
    tierEl.appendChild(el);
  });
}

function toggleChip(group, value, el) {
  if (state[group].has(value)) {
    state[group].delete(value);
    el.classList.remove('active');
  } else {
    state[group].add(value);
    el.classList.add('active');
  }
  render();
}

function clearFilter(group) {
  state[group].clear();
  document.querySelectorAll('#' + group + 'Chips .chip').forEach(c => c.classList.remove('active'));
  render();
}

function setFeeMode(mode) {
  state.feeMode = mode;
  document.querySelectorAll('.fee-mode-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  document.getElementById('feeUnit').textContent = mode === 'annual' ? '万/年' : '万';
  render();
}

function clearAll() {
  state.search = '';
  state.province.clear();
  state.edu.clear();
  state.dur.clear();
  state.tier.clear();
  state.feeMin = null;
  state.feeMax = null;
  state.includeNoFee = true;
  state.onlyNew = false;
  document.getElementById('searchInput').value = '';
  document.getElementById('feeMin').value = '';
  document.getElementById('feeMax').value = '';
  document.getElementById('includeNoFee').checked = true;
  document.getElementById('onlyNew').checked = false;
  document.querySelectorAll('.chip.active').forEach(c => c.classList.remove('active'));
  render();
}

function filterProjects() {
  return PROJECTS.filter(p => {
    if (state.search) {
      const q = state.search.toLowerCase();
      const text = (p.school + ' ' + p.major + ' ' + p.foreign).toLowerCase();
      if (!text.includes(q)) return false;
    }
    if (state.province.size > 0 && !state.province.has(p.province)) return false;
    if (state.edu.size > 0 && !state.edu.has(p.edu_cat)) return false;
    if (state.dur.size > 0 && !state.dur.has(p.dur_cat)) return false;
    if (state.tier.size > 0) {
      const tier = p.tier || '暂未分级';
      if (!state.tier.has(tier)) return false;
    }
    if (state.onlyNew && !isNew(p)) return false;

    // Fee filter
    const feeNum = getFeeNum(p);
    if (feeNum === null) {
      // no numeric fee
      if (!state.includeNoFee) return false;
      if (state.feeMin !== null || state.feeMax !== null) return false;
    } else {
      if (state.feeMin !== null && feeNum < state.feeMin) return false;
      if (state.feeMax !== null && feeNum > state.feeMax) return false;
    }
    return true;
  });
}

function renderCard(p) {
  const isNewItem = isNew(p);
  const tier = p.tier || '暂未分级';
  const tierClass = tier === '暂未分级' ? 'tag-tier-na' : 'tag-tier-a';
  const feeDisplay = p.fee || '—';
  const feeClass = p.has_fee ? 'tag-fee' : 'tag-tier-na';

  let tags = '';
  tags += '<span class="tag ' + tierClass + '">' + tier + '</span>';
  if (isNewItem) tags += '<span class="tag tag-new">新批</span>';
  tags += '<span class="tag tag-dur">' + (p.dur||'—') + '</span>';
  tags += '<span class="tag tag-edu">' + p.edu_cat + '</span>';
  if (p.quota) tags += '<span class="tag tag-quota">' + p.quota + '</span>';

  return '<div class="card" onclick=\'showDetail(' + JSON.stringify(p).replace(/'/g,"&#39;") + ')\'>' +
    '<div class="card-top">' +
      '<span class="card-school">' + p.school + '</span>' +
      '<span class="card-province">' + p.province + '</span>' +
    '</div>' +
    '<div class="card-major">' + p.major + '</div>' +
    '<div class="card-foreign">' + (p.foreign||'—') + '</div>' +
    '<div class="card-tags">' + tags + '</div>' +
    '<div class="card-fee-row">' +
      '<span><b>学费</b> ' + feeDisplay + '</span>' +
    '</div>' +
  '</div>';
}

function render() {
  const filtered = filterProjects();
  document.getElementById('resultCount').textContent = filtered.length;

  let countText = '共 <b>' + filtered.length + '</b> 个项目';
  const activeFilters = [];
  if (state.search) activeFilters.push('关键词');
  if (state.province.size) activeFilters.push('省份×' + state.province.size);
  if (state.edu.size) activeFilters.push('学历×' + state.edu.size);
  if (state.dur.size) activeFilters.push('学制×' + state.dur.size);
  if (state.tier.size) activeFilters.push('分级×' + state.tier.size);
  if (state.feeMin !== null || state.feeMax !== null) activeFilters.push('学费');
  if (state.onlyNew) activeFilters.push('仅新批');
  if (!state.includeNoFee) activeFilters.push('排除详询');
  if (activeFilters.length) countText += ' · 筛选：' + activeFilters.join('、');
  document.getElementById('resultCountText').innerHTML = countText;

  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = filtered.map(renderCard).join('');
  }
}

let currentDetailProject = null;

function showDetail(p) {
  currentDetailProject = p;
  const tier = p.tier || '暂未分级';
  const isNewItem = isNew(p);
  let html = '<h2>' + p.major + '</h2>';
  html += '<div class="modal-sub">' + p.school + ' · ' + p.province + '</div>';
  html += '<table class="modal-table">';
  html += '<tr><td>外方院校</td><td>' + (p.foreign||'—') + '</td></tr>';
  html += '<tr><td>学历要求</td><td>' + (p.edu||'—') + '</td></tr>';
  html += '<tr><td>学制</td><td>' + (p.dur||'—') + '</td></tr>';
  html += '<tr><td>学费</td><td>' + (p.fee||'—') + '</td></tr>';
  html += '<tr><td>语言要求</td><td>' + (p.lang||'—') + '</td></tr>';
  html += '<tr><td>工作经验</td><td>' + (p.exp||'—') + '</td></tr>';
  html += '<tr><td>招生人数</td><td>' + (p.quota||'—') + '</td></tr>';
  html += '<tr><td>分级</td><td>' + tier + '</td></tr>';
  if (isNewItem) html += '<tr><td>状态</td><td style="color:#b8860b;font-weight:600">2026年新批项目</td></tr>';
  html += '</table>';
  html += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">';
  html += '<button onclick="closeModal();openEditModal()" style="font-size:13px;color:#667eea;text-decoration:none;background:none;border:none;cursor:pointer;padding:0">✎ 编辑修改</button>';
  html += '<a href="https://www.crs.jsj.edu.cn/" target="_blank" style="font-size:13px;color:#999;text-decoration:none">前往涉外监管网核查有效期 →</a>';
  html += '</div>';
  html += '<div style="font-size:12px;color:#bbb;margin-top:4px">已与教育部涉外监管信息网交叉核实，已删除43个不在有效期内的项目。所有项目均已核实有效期。</div>';
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// === Edit functionality (ported from original radar.html) ===
const EXPECTED_HASH = '4b646bdc7157d75613bf0687b246227f039b74e48623a7ec1387461b493ba36a';
const EDIT_STORAGE_KEY = 'sino_overrides_v2';
let overrides = {};
let currentEditKey = null;

function loadOverrides() {
  try {
    const saved = localStorage.getItem(EDIT_STORAGE_KEY);
    if (saved) overrides = JSON.parse(saved);
  } catch (e) { overrides = {}; }
}

function saveOverrides() {
  localStorage.setItem(EDIT_STORAGE_KEY, JSON.stringify(overrides));
}

function applyOverrides() {
  Object.keys(overrides).forEach(key => {
    const [school, major] = key.split('::');
    const p = PROJECTS.find(p => p.school === school && p.major === major);
    if (p) Object.assign(p, overrides[key]);
  });
}

async function verifyPassword(input) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
  const hashHex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  return hashHex === EXPECTED_HASH;
}

function openEditModal() {
  const p = currentDetailProject;
  if (!p) return;
  currentEditKey = p.school + '::' + p.major;
  document.getElementById('editSubtitle').textContent = p.school + ' · ' + p.major;
  document.getElementById('editEdu').value = p.edu || '';
  document.getElementById('editLang').value = p.lang || '';
  document.getElementById('editExp').value = p.exp || '';
  document.getElementById('editQuota').value = p.quota || '';
  document.getElementById('editDur').value = p.dur || '';
  document.getElementById('editFee').value = p.fee || '';
  document.getElementById('editTier').value = p.tier || '暂未分级';
  document.getElementById('editPassword').value = '';
  document.getElementById('editError').textContent = '';
  document.getElementById('editOverlay').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editOverlay').classList.remove('show');
  currentEditKey = null;
}

async function submitEdit() {
  if (!currentEditKey) return;
  const password = document.getElementById('editPassword').value.trim();
  if (!password) {
    document.getElementById('editError').textContent = '请输入密码';
    return;
  }
  const valid = await verifyPassword(password);
  if (!valid) {
    document.getElementById('editError').textContent = '密码错误';
    return;
  }
  const [school, major] = currentEditKey.split('::');
  const p = PROJECTS.find(p => p.school === school && p.major === major);
  if (!p) return;
  p.edu = document.getElementById('editEdu').value.trim();
  p.lang = document.getElementById('editLang').value.trim();
  p.exp = document.getElementById('editExp').value.trim();
  p.quota = document.getElementById('editQuota').value.trim();
  p.dur = document.getElementById('editDur').value.trim();
  p.fee = document.getElementById('editFee').value.trim();
  p.tier = document.getElementById('editTier').value;
  overrides[currentEditKey] = { edu: p.edu, lang: p.lang, exp: p.exp, quota: p.quota, dur: p.dur, fee: p.fee, tier: p.tier };
  saveOverrides();
  render();
  closeEditModal();
}

// Events
document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value.trim();
  render();
});
document.getElementById('feeMin').addEventListener('input', e => {
  state.feeMin = e.target.value === '' ? null : parseFloat(e.target.value);
  render();
});
document.getElementById('feeMax').addEventListener('input', e => {
  state.feeMax = e.target.value === '' ? null : parseFloat(e.target.value);
  render();
});
document.getElementById('includeNoFee').addEventListener('change', e => {
  state.includeNoFee = e.target.checked;
  render();
});
document.getElementById('onlyNew').addEventListener('change', e => {
  state.onlyNew = e.target.checked;
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    closeEditModal();
  }
});

// 显示数据更新时间和项目总数
document.getElementById('totalCount').textContent = PROJECTS.length;
if (typeof DATA_UPDATED !== 'undefined') {
  document.getElementById('dataUpdated').textContent = DATA_UPDATED;
}

loadOverrides();
applyOverrides();
buildChips();
render();
</script>
